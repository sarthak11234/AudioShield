version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: audioshield-db
    environment:
      POSTGRES_DB: audioshield
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audioshield123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d audioshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: audioshield-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
