[pytest]
# ── AudioShield Test Configuration ────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: Tests that require HuBERT model download (~360 MB). Run with --run-slow.

# Async support
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
